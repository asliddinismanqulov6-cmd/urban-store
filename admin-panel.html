<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URBAN STORE Admin Panel</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}
header {
  background: #111827;
  color: white;
  padding: 22px;
}
.container {
  padding: 25px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
}
.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0001;
}
h2 { margin-top: 0; }
form{
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 400px;
}
form input {
 width: 100%;
 box-sizing: border-box;
 padding: 12pxp;
}
</style>
</head>
<body>
<div id="adminLoginBox" class="card">
  <h2>Admin tizimiga kirish</h2>
  <form id="adminLoginForm">
    <input id="adminLogin" placeholder="Login" required>
    <input id="adminPassword" type="password" placeholder="Parol" required>
    <button type="submit">Kirish</button>
  </form>
</div>
<header>
  <h2>URBAN STORE — ADMIN</h2>
  <p>Boshqaruv paneli</p>
</header>

<div class="container">
  <h2>Umumiy ma'lumot</h2>

    </div>

    </div>

    <div class="card">
      <h3>Admin holati</h3>

    </div>
  </div>
</div>
<h2>Yangi mahsulot qoshish</h2>

<from id="productForm"
<input id="productName" placeholder="Mahsulot nomi" required>
<input id="productPrice" type="number" placeholder="Narxi" required>
<input id="productImage" placeholder="Rasm URL"
<input id="productStock" type="number" placeholder="Soni" required>
<button type="submit">Mahsulot qo'shish</button>
</form>

<script> 
document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
e.preventDefault();
const login = document.getElementById("adminLogin").value;
const password = document.getElementById("adminPassword").value;

const res = await fetch("/api/admin/login",{
  method: "POST",
  credentials: "include",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ login, password })
});
const data = await res.json();

if (!res.ok) {
  alert(data.message || "Login yoki parol xato");
  return;
}
location.reload();
});

  const product = {

  };

  const res = await fetch("/api/admin/products", {

</body>
</html>
